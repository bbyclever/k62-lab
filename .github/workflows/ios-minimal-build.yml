name: K62 Minimal iOS - build unsigned IPA

on:
  workflow_dispatch:
  push:
    paths:
      - "ios-minimal/**"
      - ".github/workflows/ios-minimal-build.yml"

permissions:
  contents: write  # publish the IPA as the "ios-latest" release

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ios-minimal
    steps:
      - uses: actions/checkout@v4

      - name: Fetch official FitCloudPro SDK
        run: git clone --depth 1 https://github.com/htangsmart/FitCloudPro-SDK-iOS.git Vendor/FitCloudPro-SDK-iOS

      - name: Select newest stable Xcode (Liquid Glass needs the iOS 26+ SDK)
        run: |
          X=$(ls -d /Applications/Xcode_*.app | grep -viE 'beta|rc' | sort -V | tail -1)
          sudo xcode-select -s "$X"
          echo "::notice title=Xcode::$X · $(xcodebuild -version | tr '\n' ' ')"

      - name: Tools
        run: |
          xcodebuild -version
          brew install xcodegen
          pod --version

      - name: Generate project and install pods
        run: |
          xcodegen generate --spec project.yml
          pod install

      - name: Build for iPhone (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -workspace K62Minimal.xcworkspace \
            -scheme K62Minimal \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee "$RUNNER_TEMP/build.log" || {
              # Surface compiler errors as run annotations (readable without logs access).
              grep -E "error:|ld: |Undefined symbol" "$RUNNER_TEMP/build.log" | sed -E 's#^/Users/runner/work/[^/]+/[^/]+/##' | sort -u | head -40 > "$RUNNER_TEMP/errors.txt" || true
              i=0
              while IFS= read -r line; do
                i=$((i+1)); [ $i -le 9 ] && echo "::error title=build $i::${line}"
              done < "$RUNNER_TEMP/errors.txt"
              echo "::error title=build all::$(sed ':a;N;$!ba;s/\n/%0A/g' "$RUNNER_TEMP/errors.txt")"
              exit 65
            }

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/dd/Build/Products/Release-iphoneos/K62Minimal.app"
          test -d "$APP"
          mkdir -p "$RUNNER_TEMP/pkg/Payload"
          cp -R "$APP" "$RUNNER_TEMP/pkg/Payload/"
          cd "$RUNNER_TEMP/pkg"
          /usr/bin/zip -qry "$GITHUB_WORKSPACE/K62Minimal-unsigned.ipa" Payload

      - uses: actions/upload-artifact@v4
        with:
          name: K62Minimal-unsigned-ipa
          path: K62Minimal-unsigned.ipa
          retention-days: 14

      # Stable download link without GitHub login:
      # https://github.com/<owner>/<repo>/releases/download/ios-latest/K62Minimal-unsigned.ipa
      - name: Publish IPA as release "ios-latest"
        if: github.ref == 'refs/heads/main'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ios-latest --yes --cleanup-tag || true
          gh release create ios-latest K62Minimal-unsigned.ipa \
            --target "${{ github.sha }}" --prerelease \
            --title "K62 Minimal iOS (sin firmar)" \
            --notes "IPA sin firmar compilado desde ${{ github.sha }}. Fírmalo con tu Apple ID (SideStore/Sideloadly) antes de instalar."
