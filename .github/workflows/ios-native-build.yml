name: K62 Lab Native - compile without signing

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios-simulator:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Verify Xcode
        run: xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: native
        run: xcodegen generate --spec project.yml
      - name: Compile iOS Simulator build (no signing)
        working-directory: native
        run: |
          set -o pipefail
          xcodebuild \
            -project K62LabNative.xcodeproj \
            -scheme K62LabNative \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Build iPhone app for sideload signing (unsigned)
        working-directory: native
        run: |
          set -eo pipefail
          xcodebuild \
            -project K62LabNative.xcodeproj \
            -scheme K62LabNative \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/k62-ios-device" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned device IPA
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/k62-ios-device/Build/Products/Debug-iphoneos/K62LabNative.app"
          test -d "$APP"
          mkdir -p "$RUNNER_TEMP/k62-package/Payload"
          cp -R "$APP" "$RUNNER_TEMP/k62-package/Payload/"
          cd "$RUNNER_TEMP/k62-package"
          /usr/bin/zip -qry "$GITHUB_WORKSPACE/K62LabNative-unsigned.ipa" Payload
          /usr/bin/unzip -tq "$GITHUB_WORKSPACE/K62LabNative-unsigned.ipa"

      - name: Upload unsigned IPA (requires signing before installing)
        uses: actions/upload-artifact@v4
        with:
          name: K62LabNative-unsigned-ipa
          path: K62LabNative-unsigned.ipa
          retention-days: 7
