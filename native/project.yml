name: K62LabNative
options:
  bundleIdPrefix: dev.k62lab
targets:
  K62LabNative:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.k62lab.native
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: "La aplicación usa Bluetooth para localizar y diagnosticar tu reloj K62."
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
